# Publica la carpeta public/ de main en GitHub Pages (rama gh-pages) cada vez que cambia.
name: Publicar sitio

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir public/ a la rama gh-pages
        run: |
          cd public
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Sitio: main ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
