# Vista previa: lo que está en la rama "diseno" se publica en GitHub Pages
# (https://aeshilfrix.github.io/sitio-frix/) para probar cambios de diseño
# antes de que lleguen al sitio de Neocities.
name: Vista previa

on:
  push:
    branches: [diseno]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vista-previa
  cancel-in-progress: true

jobs:
  previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diseno
      - name: Marcar las páginas como vista previa
        run: |
          cd public
          for f in *.html; do
            sed -i 's#<head>#<head><meta name="robots" content="noindex">#' "$f"
            sed -i 's#</body>#<div style="position:fixed;left:8px;bottom:8px;z-index:50;font:11px Verdana,sans-serif;background:\#af0a0f;color:\#fff;padding:3px 8px">Vista previa · aún no está en Neocities</div></body>#' "$f"
          done
          touch .nojekyll
      - name: Publicar en la rama gh-pages
        run: |
          cd public
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Vista previa de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
