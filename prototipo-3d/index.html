<title>Casa de juego de Frix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    /* Lienzo 3D a pantalla completa; viñeta de contenido a la derecha (ampliable), tira de salas abajo */
    --papel: #fbfaf6;
    --tinta: #141312;
    --tenue: #5b5751;
    --linea: #d8d3c8;
    --bermellon: #e0362c;
    --cobalto: #2747c8;
    --ocre: #d4921a;
    --turquesa: #108f84;
    --magenta: #c4236c;
    --sala: var(--bermellon);
    --f-rotulo: "Dela Gothic One", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    --f-texto: "Zen Kaku Gothic New", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    --borde: 3px;
    color-scheme: light;
  }
  /* Modo oscuro: la página de manga en negativo, papel negro y tinta clara */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --papel: #17161b; --tinta: #ebe6da; --tenue: #a29c91; --linea: #35333b;
      --bermellon: #f0503f; --cobalto: #7088f2; --ocre: #e5a63a; --turquesa: #2bb5a6; --magenta: #ea4f91; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --papel: #17161b; --tinta: #ebe6da; --tenue: #a29c91; --linea: #35333b;
    --bermellon: #f0503f; --cobalto: #7088f2; --ocre: #e5a63a; --turquesa: #2bb5a6; --magenta: #ea4f91; color-scheme: dark; }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 15px/1.65 var(--f-texto); overflow: hidden; }
  ::selection { background: var(--sala); color: var(--papel); }
  :focus-visible { outline: 3px solid var(--sala); outline-offset: 3px; }
  a { color: var(--tinta); text-decoration-color: var(--sala); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  a:hover { color: var(--sala); }

  #mundo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; transition: opacity 0.28s ease-out; }
  #mundo.fundido { opacity: 0; }
  #mundo.arrastra { cursor: grabbing; }
  #mundo.sobre { cursor: pointer; }
  #mundo.salir { cursor: zoom-out; }

  .vineta { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px));
    bottom: calc(104px + env(safe-area-inset-bottom, 0px)); width: min(410px, 34vw); background: var(--papel); border: var(--borde) solid var(--tinta);
    overflow-y: auto; padding: 0 20px 24px; scrollbar-width: thin; scrollbar-color: var(--tinta) transparent;
    transition: opacity 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), width 0.34s cubic-bezier(0.22, 1, 0.36, 1); }
  .vineta.amplia { width: calc(100vw - 2 * max(16px, 7vw)); right: max(16px, 7vw); padding: 0 32px 32px; }
  .herr { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; margin: 0 -20px 0; padding: 10px 10px 0; pointer-events: none; height: 0; }
  .herr button { pointer-events: auto; all: unset; box-sizing: border-box; pointer-events: auto; display: grid; place-items: center; width: 34px; height: 34px; cursor: pointer; background: var(--papel); border: 2px solid var(--tinta); color: var(--tinta); }
  .herr button:hover { background: var(--tinta); color: var(--papel); }
  .herr button:focus-visible { outline: 3px solid var(--sala); outline-offset: 2px; }
  .herr svg { width: 18px; height: 18px; }
  .contenido { padding-top: 18px; }
  .contenido > h2:first-child, .contenido > .volver:first-child { margin-right: 44px; }
  .amplia .contenido { max-width: 1060px; margin: 0 auto; padding-top: 26px; }
  .amplia .dos { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 44px; align-items: start; }
  .amplia .capitulo, .amplia .diario, .amplia .post .cuerpo { max-width: 68ch; }
  .vineta.sale { opacity: 0; transform: translateY(8px); }
  .vineta::-webkit-scrollbar { width: 8px; }
  .vineta::-webkit-scrollbar-thumb { background: var(--tinta); }
  .vineta h2 { margin: 0 0 10px; font: 400 24px/1.15 var(--f-rotulo); text-wrap: balance; }
  .amplia h2 { font-size: 32px; }
  .rotulo { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 3px 2px; margin: 2px 0 14px; }
  .rotulo .l { display: inline-block; padding: 2px 5px 3px; line-height: 1; transform: rotate(var(--r)) translateY(var(--y)); }
  .rotulo .l.a { background: var(--tinta); color: var(--papel); font: 400 1em var(--f-rotulo); }
  .rotulo .l.b { background: var(--papel); color: var(--tinta); box-shadow: inset 0 0 0 2px var(--tinta); font: 700 0.86em var(--f-texto); padding: 3px 5px; }
  .rotulo .l.c { background: var(--sala); color: var(--papel); font: 400 1.22em var(--f-rotulo); }
  .rotulo .esp { width: 9px; }
  .solo-lectores { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @keyframes entra { from { clip-path: polygon(0 0, 0 0, -14% 100%, 0 100%); } to { clip-path: polygon(0 0, 114% 0, 100% 100%, 0 100%); } }
  .contenido.entra { animation: entra 0.26s cubic-bezier(0.22, 1, 0.36, 1); }
  .hora-grande { margin: 4px 0 6px; font: 400 54px/1 var(--f-rotulo); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .mes { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 8px; }
  .mes b { font: 400 20px/1.2 var(--f-rotulo); }
  .mes .boton { padding: 6px 12px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-bottom: 12px; }
  .cal .sem { text-align: center; font-size: 12px; font-weight: 700; color: var(--tenue); padding-bottom: 2px; }
  .cal button { all: unset; box-sizing: border-box; position: relative; aspect-ratio: 1; display: grid; place-items: start; padding: 4px 5px; cursor: pointer; border: 2px solid var(--linea); font-size: 13px; font-variant-numeric: tabular-nums; max-width: 100%; }
  .cal button.con { border-color: var(--tinta); font-weight: 700; }
  .cal button.con::after { content: ""; position: absolute; right: 0; bottom: 0; border: 7px solid transparent; border-right-color: var(--sala); border-bottom-color: var(--sala); }
  .cal button.hoy { box-shadow: inset 0 0 0 2px var(--sala); }
  .cal button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
  .cal button:focus-visible { outline: 3px solid var(--sala); outline-offset: 1px; }
  .cal button:disabled { cursor: default; opacity: 0.45; }
  .vineta h3 { margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--tinta); font: 700 15px/1.3 var(--f-texto); }
  .vineta p { margin: 0 0 10px; }
  .tenue { color: var(--tenue); font-size: 13px; }
  .frase { margin: 12px 0; padding: 10px 12px; background: var(--tinta); color: var(--papel); font-weight: 500; }

  .lista { list-style: none; margin: 0; padding: 0; }
  .lista li + li { border-top: 1px solid var(--linea); }
  .lista button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; width: 100%; padding: 8px 2px; cursor: pointer; }
  .lista button:focus-visible { outline: 3px solid var(--sala); outline-offset: 1px; }
  .lista .f { font-size: 12px; color: var(--tenue); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .lista b { display: block; font-weight: 700; line-height: 1.35; }
  .lista small { font-size: 12px; color: var(--tenue); }
  .lista button { position: relative; isolation: isolate; }
  .lista button:hover::before, .lista button:focus-visible::before { content: ""; position: absolute; inset: 2px -6px; z-index: -1; background: var(--tinta); clip-path: polygon(1.5% 0, 100% 0, 98.5% 100%, 0 100%); }
  .lista button:hover b, .lista button:hover .f, .lista button:hover small, .lista button:focus-visible b, .lista button:focus-visible .f, .lista button:focus-visible small { color: var(--papel); }
  .bitacora { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .bitacora li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 5px 0; }
  .bitacora .f { color: var(--tenue); font-variant-numeric: tabular-nums; }

  .boton { all: unset; box-sizing: border-box; display: inline-block; cursor: pointer; padding: 9px 16px; background: var(--tinta); color: var(--papel); font: 700 14px/1.2 var(--f-texto);
    transition: background-color 0.15s ease-out, transform 0.1s ease-out; }
  .boton:hover { background: var(--sala); }
  .boton:active { transform: translateY(1px); }
  .boton:disabled { opacity: 0.5; cursor: default; }
  .fila { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 6px; }

  .post { display: flow-root; border: 2px solid var(--tinta); padding: 10px 12px 12px; margin-bottom: 12px; scroll-margin: 48px; }
  .post.marcado { outline: 3px solid var(--sala); outline-offset: 3px; }
  .post header { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; margin-bottom: 6px; }
  .post .asunto { font-weight: 700; font-size: 16px; }
  .post .meta { font-size: 12px; color: var(--tenue); font-variant-numeric: tabular-nums; }
  .post .cuerpo { white-space: pre-wrap; overflow-wrap: anywhere; }
  .post .cita { color: var(--sala); }
  .post .archivo { font-size: 12px; color: var(--tenue); margin: 0 0 4px; overflow-wrap: anywhere; }
  .post .archivo a { color: var(--tenue); }
  .post .img { float: left; margin: 2px 14px 6px 0; border: 2px solid var(--tinta); line-height: 0; cursor: zoom-in; max-width: calc(100% - 14px);
    background: repeating-linear-gradient(45deg, var(--papel) 0 6px, var(--linea) 6px 7px); }
  .post .img img { display: block; max-width: 125px; max-height: 125px; width: auto; height: auto; }
  .amplia .post .img img { max-width: 220px; max-height: 220px; }
  .post .img.grande { float: none; display: table; margin: 4px 0 8px; cursor: zoom-out; }
  .post .img.grande img { max-width: 100%; max-height: 70vh; }
  .post .sin-img { display: grid; place-items: center; width: 125px; height: 94px; padding: 6px; box-sizing: border-box; font-size: 11px; line-height: 1.3; color: var(--tenue); text-align: center; }
  .post .color { font-weight: 700; }

  .capitulo p { margin: 0 0 12px; font-size: 15.5px; line-height: 1.8; }
  .ronda { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ronda .boton { padding: 7px 12px; }
  .miniaturas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
  .amplia .miniaturas.todas { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
  .miniaturas button { all: unset; box-sizing: border-box; position: relative; cursor: pointer; aspect-ratio: 3 / 2; border: 2px solid var(--tinta); background: var(--linea); overflow: hidden; max-width: 100%; }
  .miniaturas button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .miniaturas button .letra { position: absolute; left: 0; top: 0; padding: 2px 7px; background: var(--tinta); color: var(--papel); font: 400 13px/1.3 var(--f-rotulo); }
  .miniaturas button[aria-pressed="true"] { outline: 3px solid var(--sala); outline-offset: 2px; }
  .miniaturas button:focus-visible { outline: 3px solid var(--sala); outline-offset: 2px; }
  .miniaturas .vacio { aspect-ratio: 3 / 2; border: 2px dashed var(--linea); display: grid; place-items: center; color: var(--tenue); font: 400 18px var(--f-rotulo); }
  .grupo { margin: 18px 0 6px; font-size: 13px; font-weight: 700; color: var(--tenue); }
  .visor { margin: 4px 0 14px; border: var(--borde) solid var(--tinta); background: var(--papel); }
  .visor img { display: block; width: 100%; max-height: 62vh; object-fit: contain; background: var(--papel); }
  .gal-dos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 0 28px; align-items: start; }
  .gal-dos .visor { position: sticky; top: 52px; margin-top: 18px; }
  .gal-dos .visor img { max-height: 54vh; }
  .visor .pie { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: center; padding: 8px 10px; border-top: 2px solid var(--tinta); font-size: 13px; }
  .visor .pie span { color: var(--tenue); }
  .visor .pie div { display: flex; gap: 6px; }
  .visor .pie button { all: unset; cursor: pointer; padding: 4px 10px; border: 2px solid var(--tinta); font-weight: 700; font-size: 13px; }
  .visor .pie button:hover { background: var(--tinta); color: var(--papel); }
  .visor .pie button:focus-visible { outline: 3px solid var(--sala); outline-offset: 2px; }
  .ejemplo { margin: 12px 0; padding: 8px 10px; border: 2px dashed var(--sala); font-size: 13px; }
  .enlace { all: unset; cursor: pointer; font-weight: 700; font-size: 13px; text-decoration: underline 2px var(--sala); text-underline-offset: 3px; }
  .enlace:hover { color: var(--sala); }
  .enlace:focus-visible { outline: 3px solid var(--sala); outline-offset: 2px; }
  .marcador { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 10px 0 14px; }
  .marcador div { border: 2px solid var(--tinta); padding: 6px 8px; }
  .marcador b { display: block; font: 400 24px/1.1 var(--f-rotulo); font-variant-numeric: tabular-nums; }
  .marcador span { font-size: 12px; color: var(--tenue); }
  .leyenda { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 4px; font-size: 13px; }
  .leyenda li { display: flex; gap: 8px; align-items: center; }
  .senal { width: 16px; height: 16px; flex: none; border: 2px solid var(--tinta); display: grid; place-items: center; font: 700 11px/1 var(--f-texto); }
  .senal.hundida { background: var(--sala); color: var(--papel); }
  .senal.tocada { background: var(--papel); box-shadow: inset 0 0 0 3px var(--papel), inset 0 0 0 7px var(--sala); }
  .senal.agua { background: var(--papel); }
  .senal.agua::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--tenue); }
  .senal.apuntada { background: var(--papel); border-style: dashed; }
  table.obras td.c { font-weight: 700; font-variant-numeric: tabular-nums; }
  table.obras tr[data-obra] { cursor: pointer; }
  table.obras tr[data-obra]:hover td { background: color-mix(in srgb, var(--sala) 9%, var(--papel)); }
  table.obras .portada { width: 30px; height: 42px; object-fit: cover; display: block; border: 1px solid var(--tinta); }
  .diario article { padding: 12px 0 14px; border-top: 2px solid var(--tinta); }
  .diario .dia { font-size: 12px; color: var(--tenue); font-variant-numeric: tabular-nums; }
  .diario h4 { margin: 2px 0 6px; font-size: 16px; }
  .diario .cuerpo { white-space: pre-wrap; overflow-wrap: anywhere; }
  .hallazgo { margin: 0 0 16px; padding: 12px 14px; background: var(--tinta); color: var(--papel); }
  .hallazgo p { margin: 0 0 10px; }
  .hallazgo .boton { background: var(--papel); color: var(--tinta); }
  .hallazgo .boton:hover { background: var(--sala); color: var(--papel); }
  .volver { all: unset; cursor: pointer; font-size: 13px; font-weight: 700; margin-bottom: 10px; display: inline-block; }
  .volver:hover { color: var(--sala); }

  table.obras { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.obras th { text-align: left; font-size: 12px; color: var(--tenue); font-weight: 500; border-bottom: 2px solid var(--tinta); padding: 4px 6px; }
  table.obras td { border-bottom: 1px solid var(--linea); padding: 7px 6px; }
  table.obras td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  table.obras tr.marcado td { background: color-mix(in srgb, var(--sala) 16%, var(--papel)); }

  .tira { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: stretch;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
  .tira > * { pointer-events: auto; }
  .marca { display: grid; place-items: center; padding: 0 16px; background: var(--tinta); color: var(--papel); font: 400 26px/1 var(--f-rotulo); }
  .salas { display: flex; gap: 8px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .sala-btn { all: unset; box-sizing: border-box; flex: none; cursor: pointer; display: grid; grid-template-columns: 49px minmax(0, 1fr); align-items: stretch; width: 158px; height: 66px;
    position: relative; isolation: isolate; padding: var(--borde); transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1); }
  .sala-btn::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--papel); border: var(--borde) solid var(--tinta); }
  .sala-btn .k { display: grid; place-items: center; background: var(--c); color: var(--papel); border-right: var(--borde) solid var(--tinta); font: 400 27px/1 var(--f-rotulo); }
  .sala-btn .t { padding: 9px 12px; line-height: 1.2; min-width: 0; }
  .sala-btn .t b { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sala-btn .t span { font-size: 12px; color: var(--tenue); white-space: nowrap; }
  .sala-btn:hover { transform: translateY(-2px) rotate(-1deg); }
  .sala-btn[aria-current="page"] { transform: rotate(-2.5deg) scale(1.05); z-index: 1; }
  .sala-btn[aria-current="page"]::after { background: var(--c); }
  .sala-btn[aria-current="page"]::before { content: ""; position: absolute; inset: -7px -11px -9px -9px; z-index: -2; background: var(--tinta);
    clip-path: polygon(2% 14%, 20% 0, 52% 10%, 84% 0, 100% 18%, 96% 58%, 100% 100%, 66% 88%, 34% 100%, 0 90%, 5% 50%); }
  .salas { padding: 10px 14px 6px 10px; margin: -10px -14px -6px -10px; }
  .sala-btn[aria-current="page"] .t b, .sala-btn[aria-current="page"] .t span { color: var(--papel); }
  .sala-btn:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
  .icono { all: unset; box-sizing: border-box; pointer-events: auto; flex: none; cursor: pointer; display: grid; place-items: center; width: 66px; height: 66px; background: var(--papel); color: var(--tinta); border: var(--borde) solid var(--tinta);
    transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1); }
  .icono svg { width: 26px; height: 26px; }
  .icono:hover { transform: translateY(-2px); }
  .icono:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
  .icono[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
  .ayuda { align-self: center; margin: 0; padding: 6px 10px; background: var(--papel); border: 2px solid var(--tinta); font-size: 12px; line-height: 1.35; color: var(--tenue); white-space: nowrap; }
  .ayuda kbd { font: 700 12px var(--f-texto); color: var(--tinta); }

  .velocidad { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg 3deg, color-mix(in srgb, var(--tinta) 50%, transparent) 3deg 3.35deg);
    -webkit-mask: radial-gradient(closest-side, transparent 62%, #000 100%); mask: radial-gradient(closest-side, transparent 62%, #000 100%); }
  .acciones { position: fixed; left: 16px; right: calc(min(410px, 34vw) + 92px); bottom: calc(104px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .acciones > * { pointer-events: auto; }
  .acciones p { margin: 0; padding: 5px 12px; background: var(--papel); border: 2px solid var(--tinta); font-size: 13px; }
  .acciones p:empty { display: none; }
  .acciones div { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .acciones .boton { padding: 12px 24px; font-size: 15px; border: var(--borde) solid var(--tinta); transform: skewX(-12deg); transition: box-shadow 0.15s ease-out, transform 0.15s ease-out, background-color 0.15s ease-out; }
  .acciones .boton > span { display: inline-block; transform: skewX(12deg); }
  .acciones .boton:hover { box-shadow: 6px 6px 0 var(--sala); transform: skewX(-12deg) translate(-2px, -2px); }
  .acciones .boton.claro { background: var(--papel); color: var(--tinta); }
  .acciones .boton.claro:hover { background: var(--tinta); color: var(--papel); }
  .inventario { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); width: min(300px, calc(100vw - 32px)); box-sizing: border-box;
    background: var(--papel); border: var(--borde) solid var(--tinta); padding: 0 12px 12px; }
  .inventario header { display: flex; justify-content: space-between; align-items: center; margin: 0 -12px 10px; padding: 6px 6px 6px 12px; background: var(--tinta); color: var(--papel); }
  .inventario header b { font: 400 17px/1.2 var(--f-rotulo); }
