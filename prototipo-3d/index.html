<style>
  :root {
    /* Lienzo 3D a pantalla completa; cartel de la sala arriba a la izquierda, viñeta de contenido a la derecha, tira de salas abajo */
    --papel: #fbfaf6;

    --linea: #d8d3c8;

    --borde: 3px;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 15px/1.65 var(--f-texto); overflow: hidden; }
  ::selection { background: var(--sala); color: var(--papel); }
  :focus-visible { outline: 3px solid var(--sala); outline-offset: 3px; }
  a { color: var(--tinta); text-decoration-color: var(--sala); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  a:hover { color: var(--sala); }

  #mundo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

  .cartel { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px));
    max-width: min(440px, calc(100vw - 32px)); background: var(--papel); border: var(--borde) solid var(--tinta); padding: 10px 18px 12px; }
  .cartel h1 { margin: 0; font: 400 clamp(30px, 3.4vw, 46px)/1.05 var(--f-rotulo); letter-spacing: -0.01em; text-wrap: balance; }
  .cartel h1 .k { color: var(--sala); margin-right: 0.22em; }
  .cartel p { margin: 6px 0 0; font-size: 13px; line-height: 1.4; color: var(--tenue); }

  .vineta { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px));
    bottom: calc(104px + env(safe-area-inset-bottom, 0px)); width: min(410px, 34vw); background: var(--papel); border: var(--borde) solid var(--tinta);
    overflow-y: auto; padding: 18px 20px 24px; scrollbar-width: thin; scrollbar-color: var(--tinta) transparent;

  .vineta::-webkit-scrollbar { width: 8px; }

  .vineta h2 { margin: 0 0 10px; font: 400 24px/1.15 var(--f-rotulo); text-wrap: balance; }
  .vineta h3 { margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--tinta); font: 700 15px/1.3 var(--f-texto); }
  .vineta p { margin: 0 0 10px; }
  .tenue { color: var(--tenue); font-size: 13px; }
  .frase { margin: 12px 0; padding: 10px 12px; background: var(--tinta); color: var(--papel); font-weight: 500; }

  .lista { list-style: none; margin: 0; padding: 0; }
  .lista li + li { border-top: 1px solid var(--linea); }
  .lista button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; width: 100%; padding: 8px 2px; cursor: pointer; }
  .lista button:focus-visible { outline: 3px solid var(--sala); outline-offset: 1px; }

  table.obras td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  table.obras tr.marcado td { background: color-mix(in srgb, var(--sala) 16%, var(--papel)); }

  .tira { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: stretch;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
  .tira > * { pointer-events: auto; }
  .marca { display: grid; place-items: center; padding: 0 16px; background: var(--tinta); color: var(--papel); font: 400 26px/1 var(--f-rotulo); }
  .salas { display: flex; gap: 8px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .sala-btn { all: unset; box-sizing: border-box; flex: none; cursor: pointer; display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: stretch; width: 172px; height: 66px;
    background: var(--papel); border: var(--borde) solid var(--tinta); transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1); }
  .sala-btn .k { display: grid; place-items: center; background: var(--c); color: var(--papel); border-right: var(--borde) solid var(--tinta); font: 400 27px/1 var(--f-rotulo); }
  .sala-btn .t { padding: 9px 12px; line-height: 1.2; min-width: 0; }
  .sala-btn .t b { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sala-btn .t span { font-size: 12px; color: var(--tenue); white-space: nowrap; }
  .sala-btn:hover { transform: translateY(-2px); }
  .sala-btn[aria-current="page"] { background: var(--c); }
  .sala-btn[aria-current="page"] .t b, .sala-btn[aria-current="page"] .t span { color: var(--papel); }
  .sala-btn:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
  .ayuda { align-self: center; margin: 0; padding: 6px 10px; background: var(--papel); border: 2px solid var(--tinta); font-size: 12px; line-height: 1.35; color: var(--tenue); white-space: nowrap; }
  .ayuda kbd { font: 700 12px var(--f-texto); color: var(--tinta); }

  .velocidad { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg 3deg, rgba(20, 19, 18, 0.5) 3deg 3.35deg);
    -webkit-mask: radial-gradient(closest-side, transparent 62%, #000 100%); mask: radial-gradient(closest-side, transparent 62%, #000 100%); }
  .aviso3d { position: fixed; left: 16px; top: 140px; max-width: 360px; margin: 0; padding: 10px 14px; background: var(--papel); border: var(--borde) solid var(--tinta); }

  @media (max-width: 760px) {
    .vineta { left: 12px; right: 12px; width: auto; top: auto; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); max-height: 42vh; }
    .cartel { top: 12px; left: 12px; padding: 8px 12px; }
    .cartel h1 { font-size: 26px; }
    .marca, .ayuda { display: none; }
    .sala-btn { width: 132px; height: 60px; grid-template-columns: 42px minmax(0, 1fr); }
    .sala-btn .t { padding: 8px 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .vineta, .sala-btn, .boton { transition: none; }
  }
</style>

 "tipo": "novela", "estado": 1, "actualizado": "2026-11-16", "idioma": "es", "resumen": {"es": ""}, "notas": {"es": ""}, "capitulos": [{"titulo": "La ciudad de cristal", "fecha": "2026-11-16", "html": "<p>Me preguntaba por qué cantaban los pájaros.<\/p><p>Bajé del tren junto a un viejo carpintero que, entre anécdotas de su oficio, me habló de lo difícil que era alejarse de la familia. Tras la partida de su hijo, escuchó lo que sus oídos habían ignorado por años: el canto de los pájaros. Sus historias fueron lo único que hizo soportable aquel viaje de un día. Él, por fin, iba a ver a su hijo después de tanto tiempo. En el centro de la terminal me despedí de él. Su familia lo esperaba; yo acababa de separarme de la mía.<\/p><p>Sobre mi cabeza escuché un chirrido rítmico que subía y bajaba de tono, como un engranaje oxidado girando sin control en lo alto de los postes. Al voltear vi lo que parecía una pequeña esfera viviente montada sobre dos alambres rígidos. Estaba cubierta por capas de hojas blancas, superpuestas como escamas, y de su frente brotaba una aguja de hueso amarillento que se abría en dos cada vez que emitía ese chirrido.<\/p><p>—<i>Qué raros animales tiene la capital.<\/i><\/p><p>Me quedé inmóvil un momento; la gente pasaba a mi lado sin mirarme. Busqué algún paradero que me llevara al centro. Aunque entre tantas personas me era imposible avanzar. Sentado en lo que parecía una cafetín espere que todo se calmara, y ya sea por el cansancio o por la música caí dormido.<\/p>"}]}], "obras": [{"id": 1, "tipo": "manga", "titulo": "Usogui", "anio": 2006, "portada": "https://s4.anilist.co/file/anilistcdn/media/manga/cover/small/bx39982-68LS2Z9075Kw.jpg", "estado": 2, "nota": 10, "fecha": "2026-11-16"}], "cambios": [{"id": 1, "fecha": "2026-11-15", "texto": {"es": "Abrí el sitio: blog, escritos, obras y galería.", "en": "Opened the site: blog, writing, titles and gallery."}}, {"id": 2, "fecha": "2026-11-15", "texto": {"es": "Mis escritos ahora tienen capítulos, subidos desde Tintero.", "en": "My writing now has chapters, uploaded from Tintero."}}, {"id": 3, "fecha": "2026-11-15", "texto": {"es": "Todo se traduce solo al inglés, menos mis historias.", "en": "Everything is translated into English automatically, except my stories."}}, {"id": 4, "fecha": "2026-11-16", "texto": {"es": "Colores en el texto e imágenes que se agrandan con un clic.", "en": "Colored text and images that grow with a click."}}, {"id": 5, "fecha": "2026-11-16", "texto": {"es": "Paneles nuevos: ahora mismo, frase del día, bitácora y fichas.", "en": "New panels: right now, quote of the day, table log and chips."}}, {"id": 6, "fecha": "2026-11-16", "texto": {"es": "Las flechas ← → del teclado pasan de una página a otra.", "en": "The ← → arrow keys move from one page to the next."}}]}</script>
<script type="module">
import * as THREE from 'three';

THREE.ColorManagement.enabled = false; // todo se trabaja en sRGB directo, como tinta sobre papel

const D = JSON.parse(document.getElementById('datos').textContent);
const menos = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const tx = o => (o && (o.es || o.en) || '').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fechaCorta = f => { const m = String(f || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1].slice(2)}` : ''; };

const PAPEL = '#fbfaf6', TINTA = '#141312', GRIS = '#c9c4b8';
const SALAS = [
  { id: 'inicio', nombre: 'Ruleta', seccion: 'Inicio', kanji: '賭', color: '#e0362c', juego: 'Ruleta del casino ilegal', caps: 'caps. 1–3', dir: null },
  { id: 'blog', nombre: 'Siete cartas', seccion: 'Blog', kanji: '札', color: '#2747c8', juego: 'Póker de siete cartas', caps: 'caps. 26–31', dir: [-1, 0] },
  { id: 'escritos', nombre: 'Librería', seccion: 'Escritos', kanji: '書', color: '#d4921a', juego: 'Apuesta de la librería', caps: 'caps. 310–323', dir: [0, -1] },
  { id: 'obras', nombre: 'Batalla naval', seccion: 'Obras', kanji: '艦', color: '#108f84', juego: 'Batalla Naval', caps: 'caps. 280–309', dir: [1, 0] },
  { id: 'galeria', nombre: 'Paneles', seccion: 'Galería', kanji: '画', color: '#c4236c', juego: 'Juego maquiavélico', caps: 'caps. 178–204', dir: [0, 1] }
];
const sala = id => SALAS.find(s => s.id === id);
const L = 18, ALTO = 4.6, GROSOR = 0.36, PUERTA = 4.6, DINTEL = 3.9, DIST = 26;
for (const s of SALAS) s.c = s.dir ? new THREE.Vector3(s.dir[0] * DIST, 0, s.dir[1] * DIST) : new THREE.Vector3();

// ---------- Contenido (viñeta) ----------
const blog = [...(D.blog || [])].sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
const escrito = (D.escritos || [])[0];
const ESTADO_ESCRITO = { 1: 'Escribiendo', 2: 'Terminado', 3: 'En pausa', 4: 'Abandonado', 5: 'Planeado' };
const TIPO_ESCRITO = { novela: 'Novela', relato: 'Relato', mundo: 'Mundo', poema: 'Poema', otro: 'Otro' };
const ESTADO_OBRA = { 1: 'En curso', 2: 'Completado', 3: 'En pausa', 4: 'Abandonado', 5: 'Planeado' };
const TIPO_OBRA = { anime: 'Anime', manga: 'Manga', pelicula: 'Película', serie: 'Serie', libro: 'Libro', comic: 'Cómic', juego: 'Juego' };
const numPost = id => 'No.' + String(id).padStart(6, '0');

function jugadas() {
  const j = blog.map(p => ({ f: p.fecha, tipo: 'Blog', titulo: tx(p.titulo), ir: 'blog', abrir: { post: p.id } }));
  if (escrito) (escrito.capitulos || []).forEach((c, i) => j.push({ f: c.fecha || escrito.actualizado, tipo: `Capítulo ${i + 1}`, titulo: c.titulo, ir: 'escritos', abrir: { cap: i } }));
  (D.obras || []).forEach(o => j.push({ f: o.fecha || '', tipo: 'Obra', titulo: o.titulo, ir: 'obras', abrir: { obra: o.titulo } }));
  return j.sort((a, b) => String(b.f).localeCompare(String(a.f)));
}

function limpiarHTML(html) {
  const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
  const ok = new Set(['P', 'EM', 'STRONG', 'B', 'I', 'U', 'BR', 'HR', 'BLOCKQUOTE']);
  const pasar = n => [...n.childNodes].map(c => c.nodeType === 3 ? esc(c.textContent) : (c.nodeType === 1 ? (ok.has(c.tagName) ? `<${c.tagName.toLowerCase()}>${pasar(c)}</${c.tagName.toLowerCase()}>`.replace(/<(br|hr)><\/(br|hr)>/, '<$1>') : pasar(c)) : '')).join('');
  return pasar(doc.body);
}
const textoPost = t => esc(t).split('\n').map(l => /^&gt;/.test(l) ? `<span class="cita">${l}</span>` : l).join('\n').trim();

const VISTAS = {
  inicio() {
    const p = D.perfil || {}, frases = (p.frases || []).map(tx).filter(Boolean);
    const frase = frases.length ? frases[new Date().getDate() % frases.length] : '';
    return `<h2>Sobre mí</h2>
      <p>${esc(tx(p.presentacion))}</p>
      ${frase ? `<p class="frase">${esc(frase)}</p>` : ''}
      <div class="fila"><button class="boton" id="girar" type="button">Girar la ruleta</button><span class="tenue">Te lleva a algo al azar.</span></div>
      <h3>Últimas jugadas</h3>
      <ol class="lista">${jugadas().slice(0, 6).map((j, i) => `<li><button type="button" data-jugada="${i}"><span class="f">${fechaCorta(j.f)}</span><span><b>${esc(j.titulo)}</b><small>${esc(j.tipo)}</small></span></button></li>`).join('')}</ol>
      <h3>Bitácora</h3>
      <ul class="bitacora">${[...(D.cambios || [])].sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)) || (b.id - a.id)).slice(0, 4).map(c => `<li><span class="f">${fechaCorta(c.fecha)}</span><span>${esc(tx(c.texto))}</span></li>`).join('')}</ul>
      ${(D.enlaces || []).length ? `<h3>Enlaces</h3><p>${D.enlaces.map(e => `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.nombre)}</a>`).join(' · ')}</p>` : ''}`;
  },
  blog() {
    if (!blog.length) return `<h2>Blog</h2><p>Todavía no hay entradas. Cada una aparece como una carta sobre la mesa.</p>`;
    return `<h2>Blog</h2><p class="tenue">Cada entrada es una carta boca arriba sobre la mesa. Haz clic en una para ir a ella.</p>
      ${blog.map(p => `<article class="post" id="post-${p.id}"><header><span class="asunto">${esc(tx(p.titulo))}</span><span class="meta">Frix · ${fechaCorta(p.fecha)} · ${numPost(p.id)}</span></header>
        <div class="cuerpo">${textoPost(tx(p.texto))}</div>${p.imagen ? '<p class="img">Esta entrada tiene una imagen; se ve en el sitio.</p>' : ''}</article>`).join('')}`;
  },
  escritos(cap) {
    if (!escrito) return `<h2>Escritos</h2><p>Todavía no hay escritos en el estante.</p>`;
    const caps = escrito.capitulos || [];
    if (cap != null && caps[cap]) {

const ALT_PASO = 2.9;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

const ENCUADRE = {
  blog: { atras: 4.8, lado: 3.6, alto: 8.0, miraD: 0.5, miraY: 0.9 },
  escritos: { atras: 5.6, lado: 2.4, alto: 5.2, miraD: -0.2, miraY: 1.0 },
  obras: { atras: 7.4, lado: 2.8, alto: 9.0, miraD: 0.4, miraY: 1.0 },
  galeria: { atras: 7.0, lado: 0.4, alto: 5.0, miraD: 5.0, miraY: 1.9 }
};
function vista(s) {
  if (!s.dir) return { pos: V3(7.4, 9.8, 8.4), mira: V3(-0.6, 0.8, -0.6) };
  const e = ENCUADRE[s.id], d = V3(s.dir[0], 0, s.dir[1]), perp = V3(-d.z, 0, d.x);
  const pos = s.c.clone().addScaledVector(d, -e.atras).addScaledVector(perp, e.lado); pos.y = e.alto;
  const mira = s.c.clone().addScaledVector(d, e.miraD); mira.y = e.miraY;
  return { pos, mira };
}
const enPasillo = (s, p) => { if (!s.dir) return false; const d = V3(s.dir[0], 0, s.dir[1]), a = p.x * d.x + p.z * d.z; return a > L / 2 - 0.2 && a < DIST - L / 2 + 0.2; };
function zonaDe(p) {
  for (const s of SALAS) if (Math.abs(p.x - s.c.x) <= L / 2 && Math.abs(p.z - s.c.z) <= L / 2) return { s, pasillo: false };
  for (const s of SALAS) if (enPasillo(s, p)) return { s, pasillo: true };
  return { s: actual, pasillo: false };
}
const puertaDentro = s => { const d = V3(s.dir[0], 0, s.dir[1]); return d.multiplyScalar(DIST - L / 2 + 2.2).setY(ALT_PASO); };
const puertaFuera = s => { const d = V3(s.dir[0], 0, s.dir[1]); return d.multiplyScalar(DIST - L / 2 - 1.4).setY(ALT_PASO); };

  let ang;
  if (a.dir) { if (!enP) pts.push(puertaDentro(a)); pts.push(puertaFuera(a)); pts.push(enArco(angulo(a))); ang = angulo(a); }

function fijarBase(s) {

const suave = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function irA(id, abrir) {
  const b = sala(id); if (!b) return;
  destino = b; marcarTira(b);
  if (b === actual && !viaje) { pintarVineta(b, abrir); return; }
  const curva = new THREE.CatmullRomCurve3(ruta(camara.position, b), false, 'centripetal', 0.5);
  const largo = curva.getLength();

  }

  viaje = { curva, b, abrir, t0: performance.now(), dur: Math.min(3.6, Math.max(1.7, largo / 10.5)) * 1000, miraIni: camara.position.clone().addScaledVector(dir, 6) };

// Arrastrar para mirar; clic sin arrastre para usar los objetos
let arrastre = null;
const ray = new THREE.Raycaster(), puntero = new THREE.Vector2();
function tocado(e) {

      float grano = (azar(floor(gl_FragCoord.xy / 1.5)) - 0.5) * 0.03;

addEventListener('resize', medir);

function dibujar() {
  escena.overrideMaterial = matN; renderer.setRenderTarget(rtN); renderer.render(escena, camara);
  escena.overrideMaterial = null; renderer.setRenderTarget(rtC); renderer.render(escena, camara);

let antes = performance.now();
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
function cuadro(ahora) {
  requestAnimationFrame(cuadro);
  if (document.hidden) { antes = ahora; return; }
  const dt = Math.min(0.05, (ahora - antes) / 1000); antes = ahora;
  if (viaje) {
    const t = THREE.MathUtils.clamp((ahora - viaje.t0) / viaje.dur, 0, 1), e = suave(t);
    viaje.curva.getPointAt(e, camara.position);
    viaje.curva.getPointAt(Math.min(1, e + 0.14), tmp);
    const fin = vista(viaje.b).mira, w0 = 1 - THREE.MathUtils.smoothstep(t, 0, 0.18), w1 = THREE.MathUtils.smoothstep(t, 0.62, 1);
    tmp2.copy(tmp).lerp(viaje.miraIni, w0).lerp(fin, w1);
    camara.lookAt(tmp2);
    const vel = Math.sin(Math.PI * t);
    $('#velocidad').style.opacity = (vel * 0.22).toFixed(3);
    if (t >= 1) llegar(viaje.b, viaje.abrir);
  } else {
    const deriva = menos ? 0 : Math.sin(ahora / 4200) * 0.03;
    const th = base.th + mirar.dTh + deriva, ph = THREE.MathUtils.clamp(base.ph + mirar.dPh, 0.12, 1.25), r = base.r * (1 + mirar.dR);
    tmp.set(Math.sin(th) * Math.cos(ph), Math.sin(ph), Math.cos(th) * Math.cos(ph)).multiplyScalar(r).add(base.mira);
    camara.position.lerp(tmp, 1 - Math.exp(-dt * 7)); camara.lookAt(base.mira);

  if (giro) {
    const g = (ahora - giro.t0) / 1000;

}

async function empezar() {

  const h = location.hash.slice(1); if (sala(h) && h !== 'inicio') { const s = sala(h); actual = destino = s; camara.position.copy(vista(s).pos); fijarBase(s); marcarTira(s); pintarCartel(s); pintarVineta(s); }
  requestAnimationFrame(cuadro);
}
empezar();
